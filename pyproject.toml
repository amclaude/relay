[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard"
version = "0.1.0"
description = "Multi-user Telegram bot where each user connects their own Gmail account."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "SQLAlchemy>=2.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.120",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["switchboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
